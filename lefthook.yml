pre-commit:
  parallel: false
  commands:
    biome:
      glob: '*.{ts,js,json,jsonc}'
      run: pnpm exec biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    types:
      run: pnpm typecheck

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-push:
  parallel: false
  commands:
    types:
      run: pnpm typecheck
    test:
      run: pnpm test
